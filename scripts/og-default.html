<!--
  Source for public/og-default.jpg, the default link-preview image (1200×630).

  Regenerate from the project root (Git Bash on Windows; adjust the Chrome
  path for your OS):

    "/c/Program Files/Google/Chrome/Application/chrome.exe" --headless \
      --hide-scrollbars --force-device-scale-factor=1 \
      --screenshot="$PWD/public/og-default.png" --window-size=1200,630 \
      "file:///$PWD/scripts/og-default.html"

    node -e "require('sharp')('public/og-default.png').jpeg({ quality: 85, mozjpeg: true }).toFile('public/og-default.jpg').then(i => console.log(i))"

    rm public/og-default.png

  Check the result is 1200×630 and at most 300 KB.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ted Vu Blog share image</title>
    <style>
      @font-face {
        font-family: "Montserrat Variable";
        font-style: normal;
        font-weight: 100 900;
        src: url("../node_modules/@fontsource-variable/montserrat/files/montserrat-latin-wght-normal.woff2")
          format("woff2-variations");
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 110px;
        /* Light theme tokens from src/styles/global.css */
        background: rgb(189 221 252);
        color: rgb(34 41 57);
        font-family: "Montserrat Variable", sans-serif;
      }

      .rule {
        width: 96px;
        height: 10px;
        margin-bottom: 44px;
        border-radius: 999px;
        background: #2337ff;
      }

      h1 {
        font-size: 120px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.02em;
        color: rgb(15 18 25);
      }

      p {
        margin-top: 32px;
        font-size: 40px;
        font-weight: 500;
      }

      .domain {
        position: absolute;
        right: 110px;
        bottom: 70px;
        font-size: 30px;
        font-weight: 700;
        color: #2337ff;
      }
    </style>
  </head>
  <body>
    <div class="rule"></div>
    <h1>Ted Vu Blog</h1>
    <p>Notes on software, books and life.</p>
    <div class="domain">tedvu.com</div>
  </body>
</html>
